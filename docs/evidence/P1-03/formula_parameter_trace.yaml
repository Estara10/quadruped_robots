      - No claim is made that the external writer implements the DEC-007 v2 FrameHeader; it writes raw floats without sequence or timestamp.
    validation:
      fixture: NONE
      method: Static source trace of scripts/launch_abs_ray_pred.sh, scripts/ray_predictor.py and unitree_sdk2_bridge.h:69-74; an effective-config/runtime capture is still required to establish the selected writer and measured cadence.

