  - id: ABS-RAY-SOURCE-001
    kind: semantic-rule
    paper:
      source: docs/ABS_PAPER_NOTES.md:50-59
      expression: Paper perception predicts the policy ray representation from depth imagery; the source mode must preserve the declared ray contract.
      variables: [ray source mode, geometry source, timestamp clock, sequence, ray representation]
    training:
      path: ABS/training/legged_gym/legged_gym/envs/base/legged_robot_pos.py
      symbol: LeggedRobotPos.compute_observations
      line_range: 217-255
      expression_or_value: ray2d observations are generated from training object-relative positions through circle_ray_query before optional log2 conversion.
    reference:
      status: NOT_APPLICABLE
      path: NONE
      symbol: NONE
    runtime:
      path: scripts/ray_predictor.py
      symbol: main
      line_range: 37-57,139-171
      expression_or_value: The external/ray_pred writer is scripts/ray_predictor.py, launched by scripts/launch_abs_ray_pred.sh (RAY_PRED_SCRIPT=scripts/ray_predictor.py at line 17; default MUJOCO_RAY_SOURCE=ray_pred at line 21). unitree_sdk2_bridge.h:69-74 disables the geometric writer when MUJOCO_RAY_SOURCE is ray_pred or external. ray_predictor.py renders offscreen MuJoCo depth 160x90 (hfov 102 deg, camera local (0,0,0.27) m, lookahead 3 m), runs ResNet18 to 11 rays, clips depth to [0.1,6.0] m and writes log2(m) distances. It writes 11 raw float32 to /mujoco_ray2d with NO FrameHeader (no magic/version/sequence/steady_clock timestamp) and a static FPS=30 (line 48); paper declares Ray-Pred=40 Hz.
    classification: MISMATCH
    confidence: DIRECT_SOURCE
    claims_not_made:
