    - MISMATCH
    - UNKNOWN
    - CONFLICT
  allowed_confidence:
    - DIRECT_SOURCE
    - DERIVED_MECHANICALLY
    - CONDITIONAL
    - UNKNOWN
records:
  - id: ABS-ARCH-001
    kind: architecture
    paper:
      source: docs/ABS_PAPER_NOTES.md:7-19
      expression: PD=200 Hz; Agile=50 Hz; Recovery=50 Hz; RA=50 Hz; Ray-Pred=40 Hz.
      variables: [PD rate (Hz), policy/Recovery/RA rate (Hz), perception rate (Hz)]
    training:
      path: ABS/training/legged_gym/legged_gym/envs/go2/go2_pos_config.py
      symbol: Go2PosRoughCfg.control
      line_range: 70-75
      expression_or_value: action/control decimation=4; this entrypoint does not declare the simulation/control base rate.
    reference:
      status: PRESENT
      path: ABS/training/legged_gym/legged_gym/scripts/testbed.py
      symbol: play
      line_range: 104-110
    runtime:
      path: quadruped_ros2_control_humble/controllers/rl_quadruped_controller/src/RlQuadrupedController.cpp
      symbol: update
      line_range: 68-205
      expression_or_value: LeggedGymController::update (line 147) calls current_state_->run once per callback and (line 204) reads local update_rate=200 into ctrl_interfaces_.frequency_. robot_control.yaml sets controller_manager.update_rate=1000 (line 4), rl_quadruped_controller.update_rate=200 (line 152), and use_rl_thread=false (line 154). abs/config.yaml sets decimation=4 (line 7). StateRL::run (StateRL.cpp:374-387) increments sync_decimation_counter_ and calls runModel() every decimation callbacks only when use_rl_thread_ is false; when true, a dedicated thread (StateRL.cpp:173-198) calls runModel() at frequency_/decimation = 200/4 = 50 Hz. With use_rl_thread=false the runModel cadence is (callback rate)/4 = 250 Hz if callbacks run at the controller-manager 1000 Hz, or 50 Hz if callbacks run at the controller-local 200 Hz.
    classification: CONFLICT
    confidence: DIRECT_SOURCE
    claims_not_made:
      - No measured controller, policy, RA, Recovery, or ray-writer cadence is claimed.
      - An existing runtime log (logs/abs_eval/paper_full_20260610/scene_terrain/run_001/runtime.log:129,159,173,174) echoes "update rate is 1000 Hz", "Controller Update Rate: 200 Hz", "decimation=4 frequency=200Hz dt=0.0200s", and "use_rl_thread=false"; these are startup configuration echoes, not a measured callback cadence.
      - Which value (1000 Hz controller-manager vs 200 Hz controller-local) drives the actual update() callback rate is not resolvable from local repository code alone: it depends on the external ros2_control framework scheduling semantics.
    validation:
      fixture: NONE
      method: Static scheduling derivation from RlQuadrupedController.cpp, StateRL.cpp, robot_control.yaml and abs/config.yaml, plus an existing runtime log's startup configuration echoes; measured callback/policy cadence remains deferred.

