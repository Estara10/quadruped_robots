# ABS Recovery Policy Config for Go2
# 49-dim observation: contact + ang_vel + gravity + commands + dof_pos + dof_vel + actions
# No timer, no ray2d

model_name: "policy.pt"
framework: "isaacgym"
decimation: 4
num_observations: 49
observations: ["contact", "ang_vel", "gravity_vec", "commands", "dof_pos", "dof_vel", "actions"]

clip_obs: 100.0
clip_actions_lower: [-100, -100, -100,
                     -100, -100, -100,
                     -100, -100, -100,
                     -100, -100, -100]
clip_actions_upper: [100, 100, 100,
                      100, 100, 100,
                      100, 100, 100,
                      100, 100, 100]

rl_kp: [30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]
rl_kd: [0.65, 0.65, 0.65, 0.65, 0.65, 0.65, 0.65, 0.65, 0.65, 0.65, 0.65, 0.65]

hip_scale_reduction: 1.0
hip_scale_reduction_indices: [0, 3, 6, 9]
num_of_dofs: 12
action_scale: 0.25

lin_vel_scale: 1.0
ang_vel_scale: 1.0
dof_pos_scale: 1.0
dof_vel_scale: 0.2

torque_limits: [33.5, 33.5, 33.5,
                33.5, 33.5, 33.5,
                33.5, 33.5, 33.5,
                33.5, 33.5, 33.5]

# ABS recovery-specific
abs:
  contact_threshold: 1.0
